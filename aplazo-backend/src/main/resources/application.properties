spring.application.name=aplazo-backend

# Server Configuration
server.port=8080
server.servlet.context-path=/v1

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aplazo_db
spring.datasource.username=aplazo_user
spring.datasource.password=aplazo_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=aplazo-secret-key-for-jwt-token-generation-and-validation-2024
jwt.expiration=86400000

# Logging Configuration
logging.level.com.aplazo.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Rate Limiting
spring.cloud.gateway.default-filters[0]=RequestRateLimiter=2, 1, 1s


